plugins {
    id 'java'
    id 'application'
    id 'antlr'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'jacoco'
    id 'pmd'
}

group = 'xyz.ronella.gosu'
version = '0.5.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'xyz.ronella.gosu.lsp.GosuLanguageServerLauncher'
}

generateGrammarSource {
    maxHeapSize = '64m'
    arguments += ['-package', 'xyz.ronella.gosu.lsp.grammar', '-visitor', '-listener']
    outputDirectory = file("${buildDir}/generated-src/antlr/main/xyz/ronella/gosu/lsp/grammar")
}

// Include ANTLR-generated sources in compilation
sourceSets.main.java.srcDir file("${buildDir}/generated-src/antlr/main")

dependencies {
    antlr 'org.antlr:antlr4:4.13.2'
    implementation 'org.antlr:antlr4-runtime:4.13.2'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.23.1'
    implementation 'org.gosu-lang.gosu:gosu-core:1.18.5'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
    dependsOn pmdMain
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// ─── PMD static analysis (main sources only) ──────────────────────────────

pmd {
    toolVersion = '7.29.0'
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
}

pmdMain {
    exclude '**/grammar/**'                  // skip ANTLR-generated sources
    exclude '**/GosuLanguageServerLauncher*'  // launcher entry-point, excluded from coverage
}

pmdTest.enabled = false

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
        csv.required  = false
    }
    afterEvaluate {
        // Exclude ANTLR-generated grammar classes and the launcher entry-point
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/grammar/**',
                '**/GosuLanguageServerLauncher.class'
            ])
        }))
    }
}

// Produce a fat JAR with all dependencies included
shadowJar {
    archiveBaseName    = 'gosu-lsp-server'
    archiveVersion     = version
    archiveClassifier  = ''
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE   // let mergeServiceFiles() see every duplicate
    }
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class':       application.mainClass.get(),
                   'Implementation-Title':   'Gosu Language Server',
                   'Implementation-Version': version
    }
}

// Copy the fat JAR and root LICENSE to the VS Code extension directory
tasks.register('copyServerJar') {
    dependsOn shadowJar
    doLast {
        copy {
            from shadowJar.archiveFile
            into project.file('../client/server')
            rename { 'gosu-lsp-server.jar' }
        }
        copy {
            from project.file('../LICENSE')
            into project.file('../client')
        }
    }
}
