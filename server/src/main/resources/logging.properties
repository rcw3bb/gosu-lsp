# JUL configuration for the Gosu LSP server.
# Logs go to stderr (not stdout, which is reserved for the LSP JSON-RPC stream).
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
# Single-line format: date time [LEVEL] logger - message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT [%4$-7s] %3$s - %5$s%n
.level = INFO
xyz.ronella.gosu.lsp.handlers.DefinitionHandler.level = INFO
